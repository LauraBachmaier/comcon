# ComCon Environment Configuration
# =================================
# This file creates a conda environment with all dependencies needed for ComCon.
#
# Usage:
#   conda env create -f environment.yml
#   conda activate comcon

name: comcon
channels:
  - conda-forge
dependencies:
  # Python 3.11 (parcels and all dependencies support >=3.10 with no upper limit).
  # We use 3.11+ rather than 3.10 because Python 3.10 crashes when loading the
  # Windows certificate store if any certificate is malformed (common on managed
  # machines), which stops Jupyter starting. Python 3.11+ skips unreadable certs.
  - python=3.11

  # Core ocean modelling
  # This installs parcels with all its dependencies including the gcc compiler needed for just-in-time compilation
  - parcels>=3.0.0

  # Geospatial libraries
  - cartopy>=0.20.0
  - geopandas>=0.10.0

  # Jupyter environment (jupyterlab already includes the notebook interface)
  - jupyterlab
  - ipywidgets>=7.6.0

  # Data handling
  - pandas=2.3.3
  - numpy=2.2.6
  - xarray>=0.19.0
  - netCDF4>=1.5.0
  - scipy>=1.7.0
  - openpyxl>=3.0.0

  # Visualisation
  - matplotlib=3.10.8
  - seaborn
  - folium>=0.12.0
  - ipyleaflet>=0.17.0

  # Utilities
  - psutil>=5.8.0
  - tqdm>=4.62.0
  - networkx
  - python-louvain
  - scikit-learn

  # Pip for packages not available on conda-forge
  # imageio-ffmpeg bundles a self-contained ffmpeg binary for MP4 export. We use it
  # instead of the conda 'ffmpeg' package, whose Windows build pulls a broken
  # gdk-pixbuf/librsvg post-link script that fails during installation.
  - pip
  - pip:
      - pygbif>=0.6.0
      - copernicusmarine>=1.0.0
      - trajan>=0.8.0
      - cmocean>=2.0.0
      - pyworms
      - imageio-ffmpeg
